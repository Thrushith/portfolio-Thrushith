<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d1b17" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#f2a541" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity=".22"/>
    </linearGradient>
    <clipPath id="view">
      <rect x="60" y="40" width="680" height="420" rx="8"/>
    </clipPath>
  </defs>

  <rect width="800" height="500" fill="#0a0908"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <ellipse cx="400" cy="270" rx="260" ry="200" fill="url(#glow)"/>

  <!-- webcam viewfinder corners -->
  <g fill="none" stroke="#6d685e" stroke-width="2" stroke-linecap="round">
    <path d="M60 80 V40 H100"/>
    <path d="M700 40 H740 V80"/>
    <path d="M740 420 V460 H700"/>
    <path d="M100 460 H60 V420"/>
  </g>

  <g font-size="12" fill="#6d685e">
    <circle cx="88" cy="66" r="5" fill="#f87171">
      <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="70">LIVE</text>
    <text x="712" y="70" text-anchor="end">webcam · real time</text>
  </g>

  <!-- the hand, gently swaying -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 400 430;3 400 430;-3 400 430" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- bones -->
    <g fill="none" stroke="#a29c8f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="400,425 340,390 300,350 275,315 258,285"/>
      <polyline points="400,425 362,300 352,240 347,200 344,165"/>
      <polyline points="400,425 402,295 402,225 402,180 402,140"/>
      <polyline points="400,425 440,300 448,238 452,196 456,162"/>
      <polyline points="400,425 474,316 490,266 498,236 506,206"/>
      <polyline points="340,390 362,300 402,295 440,300 474,316"/>
    </g>

    <!-- joints -->
    <g fill="#0a0908" stroke="#f2a541" stroke-width="2.5">
      <circle cx="400" cy="425" r="7"/>
      <circle cx="340" cy="390" r="5.5"/><circle cx="300" cy="350" r="5.5"/><circle cx="275" cy="315" r="5.5"/>
      <circle cx="362" cy="300" r="5.5"/><circle cx="352" cy="240" r="5.5"/><circle cx="347" cy="200" r="5.5"/>
      <circle cx="402" cy="295" r="5.5"/><circle cx="402" cy="225" r="5.5"/><circle cx="402" cy="180" r="5.5"/>
      <circle cx="440" cy="300" r="5.5"/><circle cx="448" cy="238" r="5.5"/><circle cx="452" cy="196" r="5.5"/>
      <circle cx="474" cy="316" r="5.5"/><circle cx="490" cy="266" r="5.5"/><circle cx="498" cy="236" r="5.5"/>
    </g>

    <!-- fingertips pulse -->
    <g fill="#f2a541">
      <circle cx="258" cy="285" r="6"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="344" cy="165" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="402" cy="140" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="456" cy="162" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin=".6s" repeatCount="indefinite"/></circle>
      <circle cx="506" cy="206" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- detection box -->
  <rect x="225" y="112" width="315" height="340" rx="4" fill="none" stroke="#f2a541" stroke-width="1.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="225" y="86" width="132" height="26" rx="3" fill="#f2a541"/>
  <text x="237" y="104" font-size="13" fill="#1a1206">hand detected</text>

  <!-- scan line -->
  <g clip-path="url(#view)">
    <rect x="60" y="0" width="680" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;460" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- readout panel -->
  <g font-size="12">
    <rect x="570" y="300" width="150" height="132" rx="6" fill="#0e0d0b" stroke="#3d3a33"/>
    <text x="586" y="326" fill="#6d685e">gesture</text>
    <text x="586" y="350" fill="#ece7dc" font-size="15">sign → text</text>
    <line x1="586" y1="366" x2="704" y2="366" stroke="#2a2823"/>
    <text x="586" y="390" fill="#6d685e">mode</text>
    <text x="586" y="412" fill="#a29c8f">tracking<tspan fill="#f2a541">_</tspan></text>
  </g>
</svg>
