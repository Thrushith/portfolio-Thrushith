<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d1b17" stroke-width="1"/>
    </pattern>

    <!-- the scene, drawn once and reused in gray and in color -->
    <linearGradient id="skyColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset=".55" stop-color="#c8656b"/>
      <stop offset="1" stop-color="#f2a541"/>
    </linearGradient>
    <linearGradient id="skyGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset=".55" stop-color="#7b7b7b"/>
      <stop offset="1" stop-color="#a9a9a9"/>
    </linearGradient>
    <linearGradient id="waterColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e48a52"/>
      <stop offset="1" stop-color="#1f3354"/>
    </linearGradient>
    <linearGradient id="waterGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#999"/>
      <stop offset="1" stop-color="#333"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="80" y="70" width="640" height="330" rx="6"/>
    </clipPath>

    <!-- sweeps left to right, revealing the colorized version -->
    <clipPath id="reveal">
      <rect x="80" y="70" width="320" height="330">
        <animate attributeName="width" values="40;600;600;40;40" keyTimes="0;.42;.55;.95;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .3 1;0 0 1 1;.6 0 .3 1;0 0 1 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="800" height="500" fill="#0a0908"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- grayscale input -->
  <g clip-path="url(#frame)">
    <rect x="80" y="70" width="640" height="330" fill="url(#skyGray)"/>
    <circle cx="520" cy="230" r="46" fill="#d6d6d6"/>
    <path d="M80 300 L200 190 L290 260 L380 170 L500 280 L590 215 L720 290 V400 H80Z" fill="#4a4a4a"/>
    <path d="M80 320 L170 260 L260 310 L350 255 L460 320 L560 280 L720 330 V400 H80Z" fill="#2e2e2e"/>
    <rect x="80" y="335" width="640" height="65" fill="url(#waterGray)"/>
    <g stroke="#bdbdbd" stroke-width="2" opacity=".5">
      <line x1="470" y1="350" x2="570" y2="350"/>
      <line x1="490" y1="362" x2="550" y2="362"/>
      <line x1="505" y1="374" x2="535" y2="374"/>
    </g>
  </g>

  <!-- colorized output -->
  <g clip-path="url(#reveal)">
    <g clip-path="url(#frame)">
      <rect x="80" y="70" width="640" height="330" fill="url(#skyColor)"/>
      <circle cx="520" cy="230" r="46" fill="#ffd27a"/>
      <path d="M80 300 L200 190 L290 260 L380 170 L500 280 L590 215 L720 290 V400 H80Z" fill="#5b3a5e"/>
      <path d="M80 320 L170 260 L260 310 L350 255 L460 320 L560 280 L720 330 V400 H80Z" fill="#2a2440"/>
      <rect x="80" y="335" width="640" height="65" fill="url(#waterColor)"/>
      <g stroke="#ffd27a" stroke-width="2" opacity=".6">
        <line x1="470" y1="350" x2="570" y2="350"/>
        <line x1="490" y1="362" x2="550" y2="362"/>
        <line x1="505" y1="374" x2="535" y2="374"/>
      </g>
    </g>
  </g>

  <!-- divider that rides the edge of the reveal -->
  <g>
    <line x1="0" y1="70" x2="0" y2="400" stroke="#f2a541" stroke-width="2"/>
    <circle cx="0" cy="235" r="13" fill="#0a0908" stroke="#f2a541" stroke-width="2"/>
    <path d="M-5 230 L-9 235 L-5 240 M5 230 L9 235 L5 240" fill="none" stroke="#f2a541" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="120 0;680 0;680 0;120 0;120 0" keyTimes="0;.42;.55;.95;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".6 0 .3 1;0 0 1 1;.6 0 .3 1;0 0 1 1"/>
  </g>

  <rect x="80" y="70" width="640" height="330" rx="6" fill="none" stroke="#3d3a33"/>

  <!-- labels -->
  <g font-size="13">
    <text x="80" y="50" fill="#a29c8f">input<tspan fill="#6d685e">  L channel</tspan></text>
    <text x="720" y="50" fill="#a29c8f" text-anchor="end">output<tspan fill="#6d685e">  L + predicted ab</tspan></text>
  </g>

  <g font-size="12" fill="#6d685e">
    <rect x="80" y="428" width="196" height="30" rx="15" fill="none" stroke="#3d3a33"/>
    <text x="178" y="447" text-anchor="middle">U-Net G · ResNet-18</text>
    <text x="298" y="447" fill="#f2a541">→</text>
    <rect x="320" y="428" width="176" height="30" rx="15" fill="none" stroke="#3d3a33"/>
    <text x="408" y="447" text-anchor="middle">PatchGAN D · 70×70</text>
    <text x="518" y="447" fill="#f2a541">→</text>
    <rect x="540" y="428" width="180" height="30" rx="15" fill="none" stroke="#f2a541"/>
    <text x="630" y="447" text-anchor="middle" fill="#ece7dc">adv + weighted L1</text>
  </g>
</svg>
